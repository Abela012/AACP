services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aacp-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    # Override the default CMD for development to use nodemon
    command: npm run dev
    restart: always
